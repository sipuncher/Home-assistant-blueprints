blueprint:
  name: Appliance Live Activity - flexible countdown and progress
  description: >-
    Creates and updates a Home Assistant Companion App Live Activity for an
    appliance using only its state entity and estimated completion sensor. The
    completion sensor may be either an absolute timestamp or a remaining
    duration such as 147 minutes.

    No start-time entity or helper is required for the default countdown-only
    mode. The countdown runs locally on the phone and is retargeted immediately
    whenever the completion timestamp changes.

    An optional progress bar can use either a native start timestamp or a native
    percentage sensor. Do not manufacture a start-time helper solely for this
    blueprint; leave progress disabled when the appliance does not expose useful
    progress data.

    Create one automation from this blueprint for each appliance, and give each
    instance a unique activity tag.

    Requirements:
      - Home Assistant Core 2026.7.0 or later
      - A Companion App version supporting Live Activities / Live Updates
      - A completion sensor with device class timestamp or duration

    Enter raw entity states as shown in Developer Tools > States. State matching
    is case-insensitive and ignores surrounding whitespace.
  domain: automation
  author: OpenAI Codex for Simon
  homeassistant:
    min_version: 2026.7.0
  input:
    appliance:
      name: Appliance
      icon: mdi:washing-machine
      input:
        appliance_name:
          name: Appliance name
          description: Static title shown on the Live Activity.
          default: Washing machine
          selector:
            text:
        state_entity:
          name: Appliance state entity
          description: Entity reporting whether the appliance is running or finished.
          selector:
            entity:
        completion_sensor:
          name: Estimated completion time
          description: >-
            Either a timestamp sensor containing the estimated completion date
            and time, or a duration sensor containing the remaining time. The
            blueprint detects the type and unit automatically.
          selector:
            entity:
              filter:
                - domain: sensor
        finished_states:
          name: Finished states
          description: >-
            One raw state per line. Entering one of these states completes the
            Live Activity and can send a normal completion notification.
          default: |-
            finished
            completed
            program_ended
          selector:
            text:
              multiline: true
        cancelled_states:
          name: Cancelled or idle states
          description: >-
            Optional: one raw state per line that should dismiss an existing Live
            Activity without sending a completion notification. These only take
            effect when the state entity changes into the configured state.
          default: |-
            off
          selector:
            text:
              multiline: true

    notifications:
      name: Notifications
      icon: mdi:cellphone
      input:
        notify_services:
          name: Mobile notification actions
          description: >-
            YAML list of Companion App notification actions. Example:
            - notify.mobile_app_simons_iphone
            - notify.mobile_app_another_iphone
          selector:
            object:
        activity_tag:
          name: Live Activity tag
          description: >-
            Unique for each appliance. Use only letters, numbers, hyphens and
            underscores, with a maximum of 64 characters.
          default: washing_machine_cycle
          selector:
            text:
        dashboard_url:
          name: Tap destination
          description: Home Assistant path opened when the activity is tapped.
          default: /
          selector:
            text:
        send_completion_notification:
          name: Send normal completion notification
          description: >-
            Also send an ordinary notification when the appliance enters a
            finished state, so completion produces an alert.
          default: true
          selector:
            boolean:
        clear_live_activity_on_finish:
          name: Dismiss Live Activity on completion
          description: >-
            When enabled, dismiss the Live Activity at completion. When disabled,
            update it to show the completed state.
          default: false
          selector:
            boolean:

    progress:
      name: Optional progress bar
      icon: mdi:progress-clock
      collapsed: true
      input:
        progress_mode:
          name: Progress source
          description: >-
            Disabled requires only the completion timestamp. Start and finish
            timestamps calculates elapsed progress. Percentage sensor uses a
            native numeric value from 0 to 100.
          default: none
          selector:
            select:
              options:
                - label: Disabled - countdown only
                  value: none
                - label: Start and finish timestamps
                  value: timestamps
                - label: Percentage sensor
                  value: percentage
        start_sensor:
          name: Start timestamp
          description: >-
            Optional. Used only in start-and-finish-timestamps mode. Its state
            must be an ISO 8601 timestamp earlier than the completion timestamp.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
        progress_sensor:
          name: Percentage sensor
          description: >-
            Optional. Used only in percentage-sensor mode. Values are limited to
            the range 0 to 100.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
        progress_update_pattern:
          name: Progress refresh interval
          description: >-
            Time-pattern minute value. /5 refreshes at minutes 0, 5, 10 and so
            on. This is ignored when progress is disabled.
          default: "/5"
          selector:
            text:

    wording:
      name: Wording
      icon: mdi:format-text
      collapsed: true
      input:
        display_layout:
          name: Running display layout
          description: >-
            iOS cannot show the message, live countdown and progress percentage
            simultaneously. Choose which information should be prioritised.
          default: state_progress_remaining
          selector:
            select:
              options:
                - label: State, progress and periodically updated time remaining
                  value: state_progress_remaining
                - label: State and live countdown
                  value: state_countdown
                - label: Progress and live countdown
                  value: progress_countdown
        state_message_format:
          name: State and remaining-time message
          description: >-
            Used by the state-and-progress layout. Supports {state}, {remaining}
            and {finish_time}.
          default: "{state} · {remaining} remaining"
          selector:
            text:
        running_message_format:
          name: Running message
          description: >-
            Fallback message used by countdown layouts. Supports {finish_time},
            {remaining} and {state}. iOS hides this message while its live
            chronometer is displayed.
          default: "Running - due {finish_time}"
          selector:
            text:
        completed_message:
          name: Completed message
          default: Cycle complete
          selector:
            text:
        completion_notification_title:
          name: Completion notification title
          default: Appliance finished
          selector:
            text:

    appearance:
      name: Appearance
      icon: mdi:palette
      collapsed: true
      input:
        running_icon:
          name: Running icon
          default: mdi:washing-machine
          selector:
            icon:
        running_color:
          name: Running colour
          default: "#2196F3"
          selector:
            text:
        completed_icon:
          name: Completed icon
          default: mdi:check-circle
          selector:
            icon:
        completed_color:
          name: Completed colour
          default: "#4CAF50"
          selector:
            text:

mode: restart
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input completion_sensor
    id: completion_time_changed

  - trigger: state
    entity_id: !input state_entity
    id: appliance_state_changed

  - trigger: homeassistant
    event: start
    id: home_assistant_started

  - trigger: time_pattern
    minutes: !input progress_update_pattern
    id: progress_update

variables:
  appliance_name: !input appliance_name
  state_entity: !input state_entity
  completion_sensor: !input completion_sensor
  finished_states_input: !input finished_states
  cancelled_states_input: !input cancelled_states
  notify_services_input: !input notify_services
  activity_tag: !input activity_tag
  dashboard_url: !input dashboard_url
  send_completion_notification: !input send_completion_notification
  clear_live_activity_on_finish: !input clear_live_activity_on_finish
  progress_mode: !input progress_mode
  start_sensor: !input start_sensor
  progress_sensor: !input progress_sensor
  display_layout: !input display_layout
  state_message_format: !input state_message_format
  running_message_format: !input running_message_format
  completed_message: !input completed_message
  completion_notification_title: !input completion_notification_title
  running_icon: !input running_icon
  running_color: !input running_color
  completed_icon: !input completed_icon
  completed_color: !input completed_color

  notify_services: >-
    {% if notify_services_input is string %}
      {{ [notify_services_input] }}
    {% else %}
      {{ notify_services_input }}
    {% endif %}

  appliance_state: >-
    {{ states(state_entity) | lower | trim }}

  previous_appliance_state: >-
    {% if trigger.id == 'appliance_state_changed' and trigger.from_state is not none %}
      {{ trigger.from_state.state | lower | trim }}
    {% else %}
      unknown
    {% endif %}

  finished_states_list: >-
    {{ finished_states_input.splitlines() | map('trim') | map('lower')
       | reject('equalto', '') | list }}

  cancelled_states_list: >-
    {{ cancelled_states_input.splitlines() | map('trim') | map('lower')
       | reject('equalto', '') | list }}

  is_finished: >-
    {{ appliance_state in finished_states_list }}

  is_cancelled: >-
    {{ appliance_state in cancelled_states_list }}

  entered_finished_state: >-
    {{ trigger.id == 'appliance_state_changed'
       and appliance_state in finished_states_list
       and previous_appliance_state not in finished_states_list }}

  entered_cancelled_state: >-
    {{ trigger.id == 'appliance_state_changed'
       and appliance_state in cancelled_states_list
       and previous_appliance_state not in cancelled_states_list }}

  now_timestamp: >-
    {{ as_timestamp(now()) | int }}

  completion_device_class: >-
    {{ state_attr(completion_sensor, 'device_class') | default('', true) | lower }}

  completion_unit: >-
    {{ state_attr(completion_sensor, 'unit_of_measurement') | default('', true) | lower }}

  completion_multiplier: >-
    {% if completion_unit in ['ms', 'millisecond', 'milliseconds'] %}
      0.001
    {% elif completion_unit in ['s', 'sec', 'second', 'seconds'] %}
      1
    {% elif completion_unit in ['min', 'minute', 'minutes'] %}
      60
    {% elif completion_unit in ['h', 'hr', 'hour', 'hours'] %}
      3600
    {% elif completion_unit in ['d', 'day', 'days'] %}
      86400
    {% else %}
      1
    {% endif %}

  completion_is_duration: >-
    {{ completion_device_class == 'duration' }}

  completion_value_is_valid: >-
    {{ states(completion_sensor) | is_number
       if completion_is_duration | bool
       else as_timestamp(states(completion_sensor), none) is not none }}

  finish_timestamp: >-
    {% if completion_is_duration | bool and states(completion_sensor) | is_number %}
      {{ (now_timestamp + (states(completion_sensor) | float(0)
          * completion_multiplier | float(1))) | int }}
    {% else %}
      {{ as_timestamp(states(completion_sensor), 0) | int }}
    {% endif %}

  has_future_completion: >-
    {{ completion_value_is_valid | bool and finish_timestamp > now_timestamp }}

  completion_change_is_meaningful: >-
    {% if trigger.id != 'completion_time_changed' %}
      true
    {% elif not (completion_is_duration | bool) %}
      true
    {% elif trigger.from_state is none or trigger.to_state is none
          or not (trigger.from_state.state | is_number)
          or not (trigger.to_state.state | is_number) %}
      true
    {% else %}
      {% set previous_finish = as_timestamp(trigger.from_state.last_updated)
          + (trigger.from_state.state | float(0) * completion_multiplier | float(1)) %}
      {% set current_finish = as_timestamp(trigger.to_state.last_updated)
          + (trigger.to_state.state | float(0) * completion_multiplier | float(1)) %}
      {{ (current_finish - previous_finish) | abs >= 60 }}
    {% endif %}

  duration_refresh_due: >-
    {{ trigger.id == 'completion_time_changed'
       and completion_is_duration | bool
       and states(completion_sensor) | is_number
       and (states(completion_sensor) | int(0)) % 5 == 0 }}

  start_timestamp: >-
    {{ as_timestamp(states(start_sensor), 0) | int if start_sensor else 0 }}

  has_timestamp_progress: >-
    {{ progress_mode == 'timestamps'
       and start_timestamp > 0
       and finish_timestamp > start_timestamp }}

  total_seconds: >-
    {{ [finish_timestamp - start_timestamp, 1] | max }}

  elapsed_seconds: >-
    {{ [[now_timestamp - start_timestamp, 0] | max, total_seconds] | min }}

  has_percentage_progress: >-
    {{ progress_mode == 'percentage'
       and progress_sensor
       and states(progress_sensor) | is_number }}

  progress_percentage: >-
    {{ [[states(progress_sensor) | float(0), 0] | max, 100] | min | round(0) | int
       if progress_sensor else 0 }}

  finish_local: >-
    {% if finish_timestamp > 0 %}
      {{ finish_timestamp | timestamp_custom('%H:%M', true) }}
    {% else %}
      unknown
    {% endif %}

  remaining_seconds: >-
    {{ [finish_timestamp - now_timestamp, 0] | max }}

  remaining_minutes: >-
    {{ ((remaining_seconds | int + 59) / 60) | int }}

  remaining_text: >-
    {% set minutes = remaining_minutes | int %}
    {% if minutes >= 60 %}
      {{ minutes // 60 }}h {{ minutes % 60 }}m
    {% else %}
      {{ minutes }} min
    {% endif %}

  appliance_state_display: >-
    {{ appliance_state | replace('_', ' ') | replace('-', ' ') | title }}

  state_message: >-
    {{ state_message_format
       | replace('{finish_time}', finish_local)
       | replace('{remaining}', remaining_text)
       | replace('{state}', appliance_state_display) }}

  running_message: >-
    {{ running_message_format
       | replace('{finish_time}', finish_local)
       | replace('{remaining}', remaining_text)
       | replace('{state}', appliance_state_display) }}

actions:
  - choose:
      - alias: Ignore routine duration countdown tick
        conditions:
          - condition: template
            value_template: >-
              {{ trigger.id == 'completion_time_changed'
                 and completion_is_duration | bool
                 and not (completion_change_is_meaningful | bool)
                 and not (duration_refresh_due | bool) }}
        sequence:
          - stop: Routine remaining-time tick; no phone update required

      - alias: Ignore scheduled refresh when progress is disabled
        conditions:
          - condition: template
            value_template: >-
              {{ trigger.id == 'progress_update' and progress_mode == 'none' }}
        sequence:
          - stop: Progress is disabled; scheduled refresh not required

      - alias: Dismiss cancelled activity
        conditions:
          - condition: template
            value_template: "{{ entered_cancelled_state | bool }}"
        sequence:
          - repeat:
              for_each: "{{ notify_services }}"
              sequence:
                - action: "{{ repeat.item }}"
                  data:
                    message: clear_notification
                    data:
                      tag: "{{ activity_tag }}"

      - alias: Complete activity
        conditions:
          - condition: template
            value_template: "{{ entered_finished_state | bool }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ clear_live_activity_on_finish | bool }}"
            then:
              - repeat:
                  for_each: "{{ notify_services }}"
                  sequence:
                    - action: "{{ repeat.item }}"
                      data:
                        message: clear_notification
                        data:
                          tag: "{{ activity_tag }}"
            else:
              - repeat:
                  for_each: "{{ notify_services }}"
                  sequence:
                    - action: "{{ repeat.item }}"
                      data:
                        title: "{{ appliance_name }}"
                        message: "{{ completed_message }}"
                        data:
                          tag: "{{ activity_tag }}"
                          live_update: true
                          critical_text: Done
                          progress: 100
                          progress_max: 100
                          alert_once: true
                          silent: true
                          notification_icon: "{{ completed_icon }}"
                          notification_icon_color: "{{ completed_color }}"
                          color: "{{ completed_color }}"
                          url: "{{ dashboard_url }}"

          - if:
              - condition: template
                value_template: "{{ send_completion_notification | bool }}"
            then:
              - repeat:
                  for_each: "{{ notify_services }}"
                  sequence:
                    - action: "{{ repeat.item }}"
                      data:
                        title: "{{ completion_notification_title }}"
                        message: "{{ completed_message }}"
                        data:
                          tag: "{{ activity_tag }}_complete"
                          notification_icon: "{{ completed_icon }}"
                          color: "{{ completed_color }}"
                          url: "{{ dashboard_url }}"

      - alias: Start or update countdown
        conditions:
          - condition: template
            value_template: >-
              {{ has_future_completion | bool
                 and not (is_finished | bool)
                 and not (is_cancelled | bool)
                 and appliance_state not in ['unknown', 'unavailable'] }}
        sequence:
          - choose:
              - alias: Show state, timestamp progress and remaining time
                conditions:
                  - condition: template
                    value_template: >-
                      {{ display_layout == 'state_progress_remaining'
                         and has_timestamp_progress | bool }}
                sequence:
                  - repeat:
                      for_each: "{{ notify_services }}"
                      sequence:
                        - action: "{{ repeat.item }}"
                          data:
                            title: "{{ appliance_name }}"
                            message: "{{ state_message }}"
                            data:
                              tag: "{{ activity_tag }}"
                              live_update: true
                              critical_text: "{{ appliance_state_display }}"
                              progress: "{{ elapsed_seconds | int }}"
                              progress_max: "{{ total_seconds | int }}"
                              progress_bar_direction: increasing
                              alert_once: true
                              silent: true
                              notification_icon: "{{ running_icon }}"
                              notification_icon_color: "{{ running_color }}"
                              progress_bar_color: "{{ running_color }}"
                              color: "{{ running_color }}"
                              url: "{{ dashboard_url }}"

              - alias: Show state, percentage progress and remaining time
                conditions:
                  - condition: template
                    value_template: >-
                      {{ display_layout == 'state_progress_remaining'
                         and has_percentage_progress | bool }}
                sequence:
                  - repeat:
                      for_each: "{{ notify_services }}"
                      sequence:
                        - action: "{{ repeat.item }}"
                          data:
                            title: "{{ appliance_name }}"
                            message: "{{ state_message }}"
                            data:
                              tag: "{{ activity_tag }}"
                              live_update: true
                              critical_text: "{{ appliance_state_display }}"
                              progress: "{{ progress_percentage | int }}"
                              progress_max: 100
                              progress_bar_direction: increasing
                              alert_once: true
                              silent: true
                              notification_icon: "{{ running_icon }}"
                              notification_icon_color: "{{ running_color }}"
                              progress_bar_color: "{{ running_color }}"
                              color: "{{ running_color }}"
                              url: "{{ dashboard_url }}"

              - alias: Show state and live countdown
                conditions:
                  - condition: template
                    value_template: >-
                      {{ display_layout == 'state_countdown'
                         or (display_layout == 'state_progress_remaining'
                             and not (has_timestamp_progress | bool)
                             and not (has_percentage_progress | bool)) }}
                sequence:
                  - repeat:
                      for_each: "{{ notify_services }}"
                      sequence:
                        - action: "{{ repeat.item }}"
                          data:
                            title: "{{ appliance_name }}"
                            message: "{{ running_message }}"
                            data:
                              tag: "{{ activity_tag }}"
                              live_update: true
                              critical_text: "{{ appliance_state_display }}"
                              chronometer: true
                              when: "{{ finish_timestamp }}"
                              alert_once: true
                              silent: true
                              notification_icon: "{{ running_icon }}"
                              notification_icon_color: "{{ running_color }}"
                              color: "{{ running_color }}"
                              url: "{{ dashboard_url }}"

              - alias: Show timestamp progress and live countdown
                conditions:
                  - condition: template
                    value_template: >-
                      {{ display_layout == 'progress_countdown'
                         and has_timestamp_progress | bool }}
                sequence:
                  - repeat:
                      for_each: "{{ notify_services }}"
                      sequence:
                        - action: "{{ repeat.item }}"
                          data:
                            title: "{{ appliance_name }}"
                            message: "{{ running_message }}"
                            data:
                              tag: "{{ activity_tag }}"
                              live_update: true
                              critical_text: "{{ appliance_state_display }}"
                              chronometer: true
                              when: "{{ finish_timestamp }}"
                              progress: "{{ elapsed_seconds | int }}"
                              progress_max: "{{ total_seconds | int }}"
                              progress_bar_direction: increasing
                              alert_once: true
                              silent: true
                              notification_icon: "{{ running_icon }}"
                              notification_icon_color: "{{ running_color }}"
                              progress_bar_color: "{{ running_color }}"
                              color: "{{ running_color }}"
                              url: "{{ dashboard_url }}"

              - alias: Show percentage progress and live countdown
                conditions:
                  - condition: template
                    value_template: >-
                      {{ display_layout == 'progress_countdown'
                         and has_percentage_progress | bool }}
                sequence:
                  - repeat:
                      for_each: "{{ notify_services }}"
                      sequence:
                        - action: "{{ repeat.item }}"
                          data:
                            title: "{{ appliance_name }}"
                            message: "{{ running_message }}"
                            data:
                              tag: "{{ activity_tag }}"
                              live_update: true
                              critical_text: "{{ appliance_state_display }}"
                              chronometer: true
                              when: "{{ finish_timestamp }}"
                              progress: "{{ progress_percentage | int }}"
                              progress_max: 100
                              progress_bar_direction: increasing
                              alert_once: true
                              silent: true
                              notification_icon: "{{ running_icon }}"
                              notification_icon_color: "{{ running_color }}"
                              progress_bar_color: "{{ running_color }}"
                              color: "{{ running_color }}"
                              url: "{{ dashboard_url }}"

            default:
              - repeat:
                  for_each: "{{ notify_services }}"
                  sequence:
                    - action: "{{ repeat.item }}"
                      data:
                        title: "{{ appliance_name }}"
                        message: "{{ running_message }}"
                        data:
                          tag: "{{ activity_tag }}"
                          live_update: true
                          critical_text: "{{ appliance_state_display }}"
                          chronometer: true
                          when: "{{ finish_timestamp }}"
                          alert_once: true
                          silent: true
                          notification_icon: "{{ running_icon }}"
                          notification_icon_color: "{{ running_color }}"
                          color: "{{ running_color }}"
                          url: "{{ dashboard_url }}"
    default: []
